name: Add People to a Team
description: Add one or more people to a Devices domain team (invites them to the IHE org if needed)
title: "Team Add: "
labels: ["team-add"]
body:
  - type: markdown
    attributes:
      value: |
        ## Add People to a Team

        Use this to add people to a Devices domain team. If someone isn't yet a member of the IHE
        organization, adding them here **automatically sends them an org invitation** — they join the
        team once they accept.

        **Who can use this:** members of **`dev-co-chairs`**, or a **maintainer of the team** you're adding to.
        A request from anyone else is automatically declined and the issue is closed.

        **Eligible teams:** any per-repo team (e.g. `WIA_writer`, `WIA_maintainer`) and `dev-co-chairs`.

  - type: input
    id: team
    attributes:
      label: Team
      description: "The team to add people to. Case doesn't matter (e.g. WIA_writer, WIA_maintainer, dev-co-chairs)."
      placeholder: "e.g., WIA_writer"
    validations:
      required: true

  - type: textarea
    id: members
    attributes:
      label: People to add
      description: "GitHub usernames and/or email addresses — one per line (or comma-separated). A leading @ on usernames is fine."
      placeholder: |
        @alice
        bob
        carol@example.com
    validations:
      required: true
